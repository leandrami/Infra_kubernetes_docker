apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v3-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minha-api-v3
  template:
    metadata:
      labels:
        app: minha-api-v3
    spec:
      containers:
        - name: api-v3
          image: minha-api-v3:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: API_PORT
              value: "8082"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: api-v3-service
spec:
  type: ClusterIP
  selector:
    app: minha-api-v3
  ports:
    - port: 8082
      targetPort: 8082
