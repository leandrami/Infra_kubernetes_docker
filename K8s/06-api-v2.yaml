apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v2-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minha-api-v2
  template:
    metadata:
      labels:
        app: minha-api-v2
    spec:
      containers:
        - name: api-v2
          image: minha-api-v2:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: API_PORT
              value: "8081"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: api-v2-service
spec:
  type: ClusterIP
  selector:
    app: minha-api-v2
  ports:
    - port: 8081
      targetPort: 3000
